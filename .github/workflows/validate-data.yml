name: Validate Data Files

# The files under data/ are hand-edited and rendered client-side, so a missing
# field produces a broken link rather than an error. Catch it here instead of
# on the live site.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate data/*.json
        run: node scripts/validate-data.js
